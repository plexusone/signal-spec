site_name: Signal Spec
site_description: Canonical data model for operational intelligence
site_url: https://plexusone.github.io/signal-spec/
repo_url: https://github.com/plexusone/signal-spec
repo_name: plexusone/signal-spec

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concepts:
      - Overview: concepts/overview.md
      - Lifecycle States: concepts/lifecycle.md
      - Domains & Taxonomy: concepts/domains.md
  - Schema Reference:
      - Signal: schemas/signal.md
      - RootCause: schemas/rootcause.md
      - Remediation: schemas/remediation.md
      - Common Types: schemas/common.md
  - Integration:
      - Producing Signals: integration/producing.md
      - Consuming Data: integration/consuming.md
      - Validation: integration/validation.md
  - CLI Reference: cli.md
  - Examples: examples.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/signal-spec
